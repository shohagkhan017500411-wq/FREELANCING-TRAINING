
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREELANCING TRAINING</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#071426;color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;padding-bottom:25px
}
header{
  background:#0b203b;padding:18px;
  text-align:center;border-bottom:1px solid #236080
}
header h2{color:#40d9ff;font-size:20px}
.page{padding:16px;max-width:650px;margin:auto}
.folder{
  background:#102641;border:1px solid #24516e;
  padding:18px;margin-bottom:12px;
  border-radius:12px;display:flex;
  align-items:center;gap:14px;
  cursor:pointer;font-size:16px;font-weight:bold
}
.folder-icon{font-size:27px}
.folder:active{background:#17466b}
#videoPage{display:none}
.back{
  background:#173b59;color:white;border:0;
  padding:11px 17px;border-radius:8px;
  margin-bottom:18px;cursor:pointer
}
.video-box{
  background:#000;border-radius:12px;
  overflow:hidden;width:100%;
  aspect-ratio:16/9;margin:14px 0
}
.video-box iframe{
  width:100%;height:100%;border:0
}
.video-placeholder{
  height:100%;display:flex;
  align-items:center;justify-content:center;
  color:#aaa
}
.actions{
  display:flex;justify-content:space-around;
  padding:15px 0;margin-bottom:15px;
  background:#102641;border-radius:12px
}
.actions button{
  border:0;background:none;color:white;
  font-size:15px;cursor:pointer;padding:8px
}
.actions button.selected{color:#40d9ff}
h3{margin:18px 0 12px;color:#40d9ff}
.member{
  background:#102641;border:1px solid #244966;
  border-radius:11px;padding:12px;
  display:flex;align-items:center;
  gap:12px;margin-bottom:10px
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:#1769aa;display:flex;
  justify-content:center;align-items:center;
  font-size:20px
}
.member-name{flex:1;font-weight:bold}
.mic{font-size:21px;color:#40d9ff}
.mic.off{color:#ff5555}
.admin-control{
  border:0;border-radius:7px;
  padding:8px 10px;background:#1769aa;
  color:white;cursor:pointer
}
.hidden{display:none!important}
</style>
</head>

<body>

<header>
  <h2>FREELANCING TRAINING</h2>
</header>

<!-- HOME -->
<main class="page" id="homePage">

  <div class="folder" onclick="openFolder('Graphic Design')">
    <span class="folder-icon">📁</span>
    Graphic Design
  </div>

  <div class="folder" onclick="openFolder('Digital Marketing')">
    <span class="folder-icon">📁</span>
    Digital Marketing
  </div>

  <div class="folder" onclick="openFolder('Web Design')">
    <span class="folder-icon">📁</span>
    Web Design
  </div>

  <div class="folder" onclick="openFolder('Data Entry')">
    <span class="folder-icon">📁</span>
    Data Entry
  </div>

  <div class="folder" onclick="openFolder('Website Development')">
    <span class="folder-icon">📁</span>
    Website Development
  </div>

  <div class="folder" onclick="openFolder('Mobile Freelancing')">
    <span class="folder-icon">📁</span>
    Mobile Freelancing
  </div>

</main>

<!-- VIDEO PAGE -->
<main class="page" id="videoPage">

  <button class="back" onclick="goHome()">← Back</button>

  <h2 id="folderTitle">Graphic Design</h2>

  <div class="video-box" id="videoBox">
    <div class="video-placeholder">
      LIVE VIDEO
    </div>
  </div>

  <div class="actions">
    <button onclick="likeVideo(this)">👍 Like</button>
    <button onclick="dislikeVideo(this)">👎 Dislike</button>
    <button onclick="shareVideo()">↗ Share</button>
  </div>

  <h3>Members</h3>

  <div id="membersList"></div>

</main>

<script>

// Replace these with real live video embed links.
const LIVE_VIDEO_URLS = {
  "Graphic Design": "",
  "Digital Marketing": "",
  "Web Design": "",
  "Data Entry": "",
  "Website Development": "",
  "Mobile Freelancing": ""
};

// Demo member information.
// Real member accounts must come from a secure backend.
const members = [
  {id:1,name:"Your Profile",avatar:"👤",isMe:true,mic:false},
  {id:2,name:"Member 1",avatar:"👤",isMe:false,mic:false},
  {id:3,name:"Member 2",avatar:"👤",isMe:false,mic:false},
  {id:4,name:"Member 3",avatar:"👤",isMe:false,mic:false}
];

// Demo only. Admin role must be verified by the server.
const CURRENT_USER_ROLE = "member";

let currentFolder = "";

function openFolder(name){
  currentFolder = name;

  document.getElementById("homePage").style.display="none";
  document.getElementById("videoPage").style.display="block";
  document.getElementById("folderTitle").textContent=name;

  const url = LIVE_VIDEO_URLS[name];
  const box = document.getElementById("videoBox");

  if(url){
    box.innerHTML =
      '<iframe src="'+url+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  }else{
    box.innerHTML =
      '<div class="video-placeholder">LIVE VIDEO LINK NOT ADDED</div>';
  }

  showMembers();
}

function goHome(){
  document.getElementById("videoPage").style.display="none";
  document.getElementById("homePage").style.display="block";
}

function showMembers(){
  const list=document.getElementById("membersList");
  list.innerHTML="";

  members.forEach(member=>{
    const row=document.createElement("div");
    row.className="member";

    const avatar=document.createElement("div");
    avatar.className="avatar";
    avatar.textContent=member.avatar;

    const name=document.createElement("div");
    name.className="member-name";
    name.textContent=member.name;

    const mic=document.createElement("span");
    mic.className="mic"+(member.mic?"":" off");
    mic.textContent=member.mic?"🎙":"🔇";

    row.append(avatar,name,mic);

    // Only an authenticated admin should receive this control.
    if(CURRENT_USER_ROLE==="admin"){
      const control=document.createElement("button");
      control.className="admin-control";
      control.textContent=member.mic?"Turn Off":"Turn On";

      control.onclick=()=>{
        member.mic=!member.mic;
        showMembers();
      };

      row.append(control);
    }

    list.append(row);
  });
}

function likeVideo(button){
  button.classList.toggle("selected");
}

function dislikeVideo(button){
  button.classList.toggle("selected");
}

function shareVideo(){
  if(navigator.share){
    navigator.share({
      title:"FREELANCING TRAINING",
      text:"Watch this learning video",
      url:location.href
    });
  }else{
    navigator.clipboard.writeText(location.href);
    alert("Link copied");
  }
}

</script>
</body>
</html>
